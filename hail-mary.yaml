substitutions:
  name: hail-mary
  friendly_name: Hail Mary

packages:
  base: !include common/base.yaml

logger:
  level: DEBUG

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

output:
  - platform: gpio
    id: spin_phase
    pin: GPIO5

  - platform: ledc
    id: spin_pwm
    pin: GPIO6
    channel: 0
    frequency: 20 kHz

  - platform: ledc
    id: led_a
    pin: GPIO0
    channel: 2
    frequency: 20 kHz

  - platform: ledc
    id: led_b
    pin: GPIO1
    channel: 5
    frequency: 20 kHz

  - platform: ledc
    id: led_c
    pin: GPIO3
    channel: 4
    frequency: 20 kHz

  - platform: ledc
    id: led_d
    pin: GPIO4
    channel: 3
    frequency: 20 kHz

  - platform: rmt_carrier_dimmer
    id: led_w
    pin: GPIO7
    envelope_frequency: 20 kHz

fan:
  - platform: template
    name: "Spin"
    has_direction: true
    preset_modes:
      - Low
      - Medium
      - High
    icon: mdi:atom-variant
    on_state:
      - lambda: |-
          const auto preset = x->get_preset_mode();
          const float level = preset == "High" ? 1.0f : preset == "Medium" ? 0.7f : 0.5f;
          id(spin_phase).set_state(x->state && x->direction == FanDirection::REVERSE);
          id(spin_pwm).set_level(x->state ? level : 0.0f);

light:
  - platform: ranged_light
    name: "Base"
    icon: mdi:vector-square
    outputs: [led_a]
    min_brightness: 10%
    max_brightness: 40%
    default_transition_length: 0.3s
  - platform: ranged_light
    name: "Ring"
    icon: mdi:sphere
    outputs: [led_b, led_c]
    min_brightness: 10%
    max_brightness: 40%
    default_transition_length: 0.3s
  # unused channel...
  # - platform: monochromatic
  #   name: "Channel D"
  #   icon: mdi:sphere
  #   output: led_d
  #   default_transition_length: 0.3s
  - platform: ranged_light
    name: "Ship"
    icon: mdi:rocket-outline
    outputs: [led_w]
    min_brightness: 30%
    max_brightness: 70%
    default_transition_length: 0.3s
